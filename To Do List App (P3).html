<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        
        My Todo List
    
    </title>


    <style>
    
        * {
    
            margin: 0;
    
            padding: 0;
    
            box-sizing: border-box;
    
            font-family: Arial, sans-serif;
    
        }

        body {
    
            min-height: 100vh;
    
            background: linear-gradient(135deg, #07152e, #102d50);
    
            display: flex;
    
            justify-content: center;
    
            align-items: center;
    
            padding: 25px;
    
            color: white;
    
        }

        .container {
    
            width: 100%;
    
            max-width: 600px;
    
            background: #132b49;
    
            padding: 30px;
    
            border-radius: 18px;
    
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
    
        }

        h1 {
    
            text-align: center;
    
            margin-bottom: 10px;
    
            color: #ffffff;
    
        }

        .subtitle {
    
            text-align: center;
    
            color: #a9bfd8;
    
            margin-bottom: 25px;
    
        }

        .input-section {
    
            display: flex;
    
            gap: 10px;
    
            margin-bottom: 20px;
    
        }

        input {
    
            flex: 1;
    
            padding: 14px;
    
            border: 1px solid #45617f;
    
            border-radius: 8px;
     
            outline: none;
     
            background: #0b1e35;
     
            color: white;
     
            font-size: 15px;
     
        }

        input:focus {
     
            border-color: #38bdf8;
     
        }

        button {
     
            border: none;
     
            cursor: pointer;
     
            border-radius: 8px;
     
            transition: 0.3s;
     
        }

        .add-btn {
     
            background: #0284c7;
     
            color: white;
     
            padding: 14px 20px;
     
            font-weight: bold;
     
        }

        .add-btn:hover {
     
            background: #0369a1;
     
            transform: scale(1.05);
     
        }

        .stats {
     
            display: grid;
     
            grid-template-columns: repeat(3, 1fr);
     
            gap: 10px;
     
            margin-bottom: 22px;
        }

        .stat-card {
        
            background: #0b1e35;
        
            padding: 15px 5px;
        
            text-align: center;
        
            border-radius: 10px;
        
        }

        .stat-card h2 {
        
            color: #38bdf8;
        
            font-size: 23px;
        
        }

        .stat-card p {
        
            color: #a9bfd8;
        
            font-size: 12px;
        
            margin-top: 5px;
        
        }

        .filters {
        
            display: flex;
        
            justify-content: center;
        
            gap: 10px;
        
            margin-bottom: 20px;
        
        }

        .filter-btn {
        
            padding: 9px 16px;
        
            background: #203d5e;
        
            color: white;
        
        }

        .filter-btn:hover,
        .filter-btn.active {
        
            background: #0284c7;
        
        }

        ul {
        
            list-style: none;
        
        }

        .task {
        
            display: flex;
        
            align-items: center;
        
            gap: 10px;
        
            background: #0b1e35;
        
            padding: 14px;
        
            margin-bottom: 10px;
        
            border-radius: 9px;
        
        }

        .task input[type="checkbox"] {
        
            flex: 0 0 auto;
        
            width: 18px;
        
            height: 18px;
        
            cursor: pointer;
        
            accent-color: #0ea5e9;
        
        }

        .task-text {
        
            flex: 1;
        
            overflow-wrap: anywhere;
        
            font-size: 15px;
        
        }

        .task.completed .task-text {
        
            text-decoration: line-through;
        
            color: #8195ab;
        
        }

        .edit-btn {
        
            background: #eab308;
        
            color: #111827;
        
            padding: 7px 10px;
        
        }

        .delete-btn {
        
            background: #dc2626;
        
            color: white;
        
            padding: 7px 10px;
        
        }

        .edit-btn:hover {
        
            background: #ca8a04;
        
        }

        .delete-btn:hover {
        
            background: #b91c1c;
        
        }

        .empty-message {
        
            text-align: center;
        
            color: #91a8c0;
        
            padding: 25px 5px;
        
        }

        .bottom-section {
        
            display: flex;
        
            justify-content: space-between;
        
            align-items: center;
        
            gap: 10px;
        
            margin-top: 20px;
        
        }

        .bottom-section p {
        
            color: #a9bfd8;
        
            font-size: 13px;
        
        }

        .clear-btn {
        
            background: #7f1d1d;
        
            color: white;
        
            padding: 10px 13px;
        
        }

        .clear-btn:hover {
        
            background: #991b1b;
        
        }

        @media (max-width: 450px) {
        
            .container {
        
                padding: 20px;
        
            }

            .input-section {
        
                flex-direction: column;
        
            }

            .filters {
        
                gap: 5px;
        
            }

            .filter-btn {
        
                padding: 8px 11px;
        
            }

            .task {
        
                flex-wrap: wrap;
        
            }
        }
    
    </style>

</head>

<body>

    <div class="container">

        <h1>
            
            My Todo List
        
        </h1>
        
        <p class="subtitle">
            
            Organize your day, one task at a time.
        
        </p>

        <!-- Add Task -->
        
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                maxlength="200"
            >

            <button class="add-btn" id="addBtn" onclick="addTask()">
        
                + Add Task
        
            </button>

        </div>

        <!-- Task Statistics -->
        
        <div class="stats">

            <div class="stat-card">
        
                <h2 id="totalTasks">
                    
                    0
                
                </h2>
        
                <p>
                    
                    Total Tasks
                
                </p>
            
            </div>

            <div class="stat-card">
            
                <h2 id="completedTasks">
                    
                    0
                
                </h2>
            
                <p>
                    
                    Completed
                
                </p>
            
            </div>

            <div class="stat-card">

                <h2 id="pendingTasks">
                    
                    0
                
                </h2>
                
                <p>
                    
                    Pending
                
                </p>

            </div>

        </div>

        <!-- Filters -->
       
        <div class="filters">

            <button class="filter-btn active"
                onclick="filterTasks('all', this)">
               
                All
            
            </button>

            <button class="filter-btn"
                onclick="filterTasks('pending', this)">
            
                Pending
            
            </button>

            <button class="filter-btn"
                onclick="filterTasks('completed', this)">
            
                Completed
            
            </button>

        </div>

        <!-- Task List -->
        
        <ul id="taskList"></ul>

        <!-- Bottom Section -->
        
        <div class="bottom-section">

            <p id="remainingText">
                
                0 tasks remaining
            
            </p>

            <button class="clear-btn" onclick="clearCompleted()">
             
                Clear Completed
            
            </button>

        </div>

    </div>

    <script>

        // Retrieve tasks from Local Storage
       
        let tasks = JSON.parse(localStorage.getItem("myTasks")) || [];

        let currentFilter = "all";

        // Save tasks to Local Storage
       
        function saveTasks() {

            localStorage.setItem(
                "myTasks",
                JSON.stringify(tasks)
       
            );

        }

        // Add a new task
       
        function addTask() {

            const input = document.getElementById("taskInput");

            const taskText = input.value.trim();

            if (taskText === "") {
       
                alert("Please enter a task!");
       
                return;
       
            }

            const task = {
       
                id: Date.now() + Math.random(),
                text: taskText,
                completed: false
       
            };

            tasks.push(task);

            saveTasks();

            input.value = "";

            displayTasks();

        }

        // Add task using Enter key
        document.getElementById("taskInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                   
                    addTask();
                
                }

            });

        // Display tasks
        
        function displayTasks() {

            const taskList = document.getElementById("taskList");

            taskList.innerHTML = "";

            let filteredTasks = tasks.filter(task => {

                if (currentFilter === "pending") {
        
                    return !task.completed;
        
                }

                if (currentFilter === "completed") {
        
                    return task.completed;
        
                }

                return true;

            });

            if (filteredTasks.length === 0) {

                const message = document.createElement("li");

                message.className = "empty-message";

                message.textContent = tasks.length === 0
                    ? "No tasks yet. Add your first task!"
                    : "No tasks found in this category.";

                taskList.appendChild(message);

            }

            filteredTasks.forEach(task => {

                const li = document.createElement("li");

                li.className = "task";

                if (task.completed) {
        
                    li.classList.add("completed");
        
                }

                // Checkbox
        
                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";

                checkbox.checked = task.completed;

                checkbox.addEventListener("change", function() {
        
                    toggleTask(task.id);
        
                });

                // Task Text
                const span = document.createElement("span");

                span.className = "task-text";

                span.textContent = task.text;

                // Edit Button
        
                const editBtn = document.createElement("button");

                editBtn.className = "edit-btn";

                editBtn.textContent = "Edit";

                editBtn.onclick = function() {
                    editTask(task.id);
                };

                // Delete Button
        
                const deleteBtn = document.createElement("button");

                deleteBtn.className = "delete-btn";

                deleteBtn.textContent = "Delete";

                deleteBtn.onclick = function() {
        
                    deleteTask(task.id);
        
                };

                li.appendChild(checkbox);
        
                li.appendChild(span);
        
                li.appendChild(editBtn);
        
                li.appendChild(deleteBtn);

                taskList.appendChild(li);

            });

            updateStatistics();

        }

        // Mark task as completed or pending
        
        function toggleTask(id) {

            tasks = tasks.map(task => {

                if (task.id === id) {
        
                    task.completed = !task.completed;
        
                }

                return task;

            });

            saveTasks();

            displayTasks();

        }

        // Edit task
        
        function editTask(id) {

            const task = tasks.find(task => task.id === id);

            const updatedText = prompt(
        
               "Edit your task:",
                task.text
            
            );

            if (updatedText === null) return;

            if (updatedText.trim() === "") {
            
                alert("Task cannot be empty!");
            
                return;
            
            }

            task.text = updatedText.trim();

            saveTasks();

            displayTasks();

        }

        // Delete task
        
        function deleteTask(id) {

            if (!confirm("Are you sure you want to delete this task?")) {
        
                return;
        
            }

            tasks = tasks.filter(task => task.id !== id);

            saveTasks();

            displayTasks();

        }

        // Filter tasks
        
        function filterTasks(filter, button) {

            currentFilter = filter;

            document.querySelectorAll(".filter-btn")
                .forEach(btn => btn.classList.remove("active"));

            button.classList.add("active");

            displayTasks();

        }

        // Clear completed tasks
        function clearCompleted() {

            if (!tasks.some(task => task.completed)) {
        
                alert("There are no completed tasks!");
        
                return;
            }

            if (!confirm("Delete all completed tasks?")) {
        
                return;
        
            }

            tasks = tasks.filter(task => !task.completed);

            saveTasks();

            displayTasks();

        }

        // Update task statistics
        
        function updateStatistics() {

            const total = tasks.length;

            const completed = tasks.filter(
                task => task.completed
            ).length;

            const pending = total - completed;

            document.getElementById("totalTasks").textContent = total;

            document.getElementById("completedTasks").textContent = completed;

            document.getElementById("pendingTasks").textContent = pending;

            document.getElementById("remainingText").textContent =
                pending + (pending === 1 ? " task remaining" : " tasks remaining");

        }

        // Load saved tasks when the page opens

        displayTasks();

    </script>

</body>

</html>
